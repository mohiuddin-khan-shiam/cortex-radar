# ==============================================================================
# CortexRadar - Centralized Pipeline Configuration
# ==============================================================================
# Forkers & Maintainers: Customize this file to personalize your radar!
# All changes here immediately alter the data ingested, categories, and display.
# ==============================================================================

radar:
  name: "CortexRadar"
  version: "1.0.0"
  tagline: "Autonomous AI Research & Open-Source Developer Tools Radar"
  timezone: "UTC"
  author: "CortexRadar Community"
  repo_url: "https://github.com/cortexradar/cortex-radar"
  dashboard_url: "https://cortexradar.github.io/cortex-radar/"

# ------------------------------------------------------------------------------
# Data Sources
# ------------------------------------------------------------------------------
sources:
  arxiv:
    enabled: true
    max_results: 35
    query_window_days: 3
    # ArXiv Categories to monitor:
    # cs.AI: Artificial Intelligence
    # cs.LG: Machine Learning
    # cs.CL: Computation and Language (NLP, LLMs)
    # cs.CV: Computer Vision and Pattern Recognition
    # cs.RO: Robotics
    # stat.ML: Statistics - Machine Learning
    categories:
      - "cs.AI"
      - "cs.LG"
      - "cs.CL"
      - "cs.CV"
      - "cs.RO"
      - "stat.ML"
    sort_by: "submittedDate" # Options: submittedDate, lastUpdatedDate
    sort_order: "descending"
    timeout_seconds: 25
    max_retries: 3
    backoff_factor: 2.0

  github:
    enabled: true
    max_results: 35
    min_stars: 25
    query_window_days: 7
    # Topics queried against GitHub Search API
    topics:
      - "llm"
      - "large-language-models"
      - "machine-learning"
      - "deep-learning"
      - "generative-ai"
      - "ai-agents"
      - "agentic"
      - "developer-tools"
      - "vision-language-models"
      - "vllm"
      - "diffusion"
    # Target programming languages
    languages:
      - "Python"
      - "Rust"
      - "TypeScript"
      - "Go"
      - "C++"
    timeout_seconds: 25
    max_retries: 3
    backoff_factor: 2.0

# ------------------------------------------------------------------------------
# Taxonomy & Categorization Rules
# Items are matched against keywords to assign a primary category and badges
# ------------------------------------------------------------------------------
categories:
  - id: "llm_reasoning"
    name: "LLMs & Reasoning"
    badge: "🧠 LLMs & Reasoning"
    color: "#6366f1"
    keywords:

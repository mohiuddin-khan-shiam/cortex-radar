# ------------------------------------------------------------------------------
# Output & Storage Settings
# ------------------------------------------------------------------------------
output:
  readme_top_count: 10
  daily_digest_top_count: 25
  archive_dir: "archives"
  data_dir: "data"
  docs_dir: "docs"
  master_json: "data/master_dataset.json"
  master_csv: "data/master_dataset.csv"
  docs_json: "docs/data/master_dataset.json"

name: Daily Autonomous AI & Tech Radar Update

on:
  schedule:
    # Runs everyday at 02:00 UTC (9:00 PM EST / 6:00 PM PST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Allow workflow to commit changes and deploy pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-radar-pipeline"
  cancel-in-progress: false

jobs:
  update-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📡 Execute CortexRadar Ingestion Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

      - name: 🧪 Run Integrity Unit Tests
        run: |
          pytest -v --tb=short

      - name: 🚀 Commit & Push Daily Radar Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ archives/ docs/ README.md

          # Check if there are changes staged
          if git diff --staged --quiet; then
            echo "No changes discovered today. Skipping commit."
          else
            TODAY=$(date -u +"%Y-%m-%d")
            git commit -m "chore(data): update daily AI & tech radar for ${TODAY} [skip ci]"
            git push
            echo "Successfully pushed daily radar update!"
          fi
